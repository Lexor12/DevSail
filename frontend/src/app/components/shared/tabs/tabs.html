<div class="tabs" [class.full]="variant() === 'full'" role="tablist">
  @for (option of options(); track option.value) {
    <button type="button" role="tab" class="tab" [class.active]="option.value === selected()"
            [attr.aria-selected]="option.value === selected()" (click)="changed.emit(option.value)">
      {{ option.text }}
    </button>
  }
</div>
