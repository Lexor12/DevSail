<form class="form" (submit)="login($event)" novalidate>
  <h1 class="title">Bienvenido de nuevo</h1>
 
  <div>
    <label class="label" for="email">Correo</label>
    <input class="field" type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required>
  </div>
 
  <div>
    <label class="label" for="password">Contraseña</label>
    <div class="with-button">
      <input class="field" [type]="showPassword() ? 'text' : 'password'" id="password" name="password"
             placeholder="••••••••" autocomplete="current-password" required>
      <button type="button" class="btn-text show" (click)="showPassword.set(!showPassword())">
        {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
      </button>
    </div>
  </div>

  <!-- Abre la ventana M01 Recuperar contraseña cuando se programe -->
  <button type="button" class="btn-text forgot">¿Olvidaste tu contraseña?</button>

  @if (error()) {
    <p class="alert-error">{{ error() }}</p>
  }

  <button type="submit" class="btn btn-primary btn-block submit" [disabled]="sending()">
    {{ sending() ? 'Entrando…' : 'Entrar' }}
  </button>

  <p class="bottom">¿No tienes cuenta? <a routerLink="/auth/register">Regístrate gratis</a></p>
</form>
